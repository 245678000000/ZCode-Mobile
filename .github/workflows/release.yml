name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag（留空则使用 app/build.gradle.kts 中的 versionName）'
        required: false
        default: ''
      release_title:
        description: 'Release Title（留空则为 "ZCode Mobile <tag>"）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release keystore comes from repository secrets so every Release is signed with the
      # SAME key and users can upgrade in place. Set these four secrets once:
      #   RELEASE_KEYSTORE_BASE64  — `base64 -i app/keystore/zcode-mobile-release.jks`
      #   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      - name: Restore release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set. A Release signed with a throwaway key cannot be upgraded by users."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "path=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs with Gradle
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Package Release Assets
        id: package
        run: |
          mkdir -p release-assets

          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            REL_TITLE="${{ github.event.inputs.release_title }}"
          else
            REL_TITLE="ZCode Mobile ${TAG_NAME}"
          fi

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "REL_TITLE=${REL_TITLE}" >> $GITHUB_ENV

          cp app/build/outputs/apk/release/app-release.apk release-assets/zcode-mobile-${TAG_NAME}-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/zcode-mobile-${TAG_NAME}-debug.apk

          cd release-assets
          sha256sum *.apk > sha256-checksums.txt
          echo "=== Generated Checksums ==="
          cat sha256-checksums.txt
          cd ..

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zcode-mobile-apks
          path: release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.REL_TITLE }}
          files: |
            release-assets/*.apk
            release-assets/sha256-checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

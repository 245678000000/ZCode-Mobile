name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如 v0.2.0)'
        required: false
        default: 'v0.2.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'ZCode Mobile v0.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Debug Keystore for Release signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Package Release Assets
        id: package
        run: |
          mkdir -p release-assets

          # 提取当前 Tag
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v0.2.0"
          fi

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            REL_TITLE="${{ github.event.inputs.release_title }}"
          else
            REL_TITLE="ZCode Mobile ${TAG_NAME}"
          fi

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "REL_TITLE=${REL_TITLE}" >> $GITHUB_ENV

          # 复制并规范命名 APK 文件
          cp app/build/outputs/apk/release/app-release.apk release-assets/zcode-mobile-${TAG_NAME}-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/zcode-mobile-${TAG_NAME}-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-assets/app-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/app-debug.apk

          # 生成 SHA256 校验和文件
          cd release-assets
          sha256sum *.apk > sha256-checksums.txt
          echo "=== Generated Checksums ==="
          cat sha256-checksums.txt
          cd ..

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zcode-mobile-apks
          path: release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.REL_TITLE }}
          files: |
            release-assets/*.apk
            release-assets/sha256-checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

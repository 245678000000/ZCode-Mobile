[versions]
agp = "9.4.0"
kotlin = "2.3.21"
composeBom = "2026.06.01"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
navigation = "2.9.3"
datastore = "1.1.7"
camerax = "1.4.2"
